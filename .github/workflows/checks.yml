name: Check Read & Found
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression checks
        run: python tests/test_regressions.py
      - name: Saved list security
        run: node tests/share-proof.test.mjs
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check worker/index.js
          node --check api/_adapter.js
          node --check api/list.js
          node --check api/list-page.js
          node --check api/list-og.js
          node --check api/site-og.js
          node --check lib/saved-list.js
          node --check lib/share-proof.js
          node --check refinements-v26.js

      - name: Public sharing routes
        run: |
          code=$(curl -L -sS --max-time 25 -o /tmp/readfound-og.png -w '%{http_code}' https://readandfound.com/api/site-og)
          test "$code" = "200"
          file /tmp/readfound-og.png | grep -q "PNG image"
          code=$(curl -L -sS --max-time 25 -o /dev/null -w '%{http_code}' https://readandfound.com/list/abcdefghijkl)
          test "$code" = "404"
          code=$(curl -L -sS --max-time 25 -o /dev/null -w '%{http_code}' 'https://readandfound.com/api/list-og?id=abcdefghijkl')
          test "$code" = "404"
